# Production deploy. Manual only, three approvals, and the ORDER IS THE SAFETY PROPERTY.
#
#   1. indexes  -> 2. app  -> 3. rules
#
# WHY RULES MUST BE LAST. The rules now require `date` to be a timestamp on invoice create.
# Deploying that before the app means anyone still served the OLD bundle — every open tab, every
# cached client, and the onboarding wizard that used to write no `date` at all — has invoice
# creation rejected. That breaks new-tenant onboarding, which is the worst possible thing to break
# silently. The app must be serving the writer that satisfies the contract before the contract is
# enforced.
#
# WHY INDEXES ARE FIRST. An index build is the only step that takes minutes rather than seconds,
# and a query that needs a missing composite index fails with FAILED_PRECONDITION, which this
# codebase has repeatedly shown is INVISIBLE from the UI. Indexes must be READY before the app
# that queries them is serving.
#
# Each job is a separate GitHub Environment approval on purpose. One approval for "deploy" would
# let a reviewer wave through the rules change while only having looked at the app change, and the
# rules change is the one that can lock every tenant out of creating an invoice.

name: Deploy (production)

on:
    workflow_dispatch:
        inputs:
            confirm:
                description: 'Type "deploy" to confirm you intend a PRODUCTION release'
                required: true
                type: string

concurrency:
    group: deploy-production
    cancel-in-progress: false

jobs:
    # ---------------------------------------------------------------- 0. guard
    preflight:
        runs-on: ubuntu-latest
        steps:
            - name: Confirm intent
              run: |
                  if [ "${{ inputs.confirm }}" != "deploy" ]; then
                    echo "Refusing: the confirm input must be exactly 'deploy'."
                    exit 1
                  fi
            - uses: actions/checkout@v4
            - name: Refuse to deploy a ref that has not passed Gates
              uses: actions/github-script@v7
              with:
                  script: |
                      const { data } = await github.rest.checks.listForRef({
                        owner: context.repo.owner, repo: context.repo.repo, ref: context.sha,
                      });
                      const gates = data.check_runs.filter(c => c.name.includes('gates'));
                      if (!gates.length) throw new Error('No Gates run found for this commit. Push it and let Gates pass first.');
                      const bad = gates.filter(c => c.conclusion !== 'success');
                      if (bad.length) throw new Error(`Gates did not pass: ${bad.map(c => c.name + '=' + c.conclusion).join(', ')}`);
                      core.info('Gates passed for this commit.');

    # ------------------------------------------------------- 1. firestore indexes
    indexes:
        needs: preflight
        runs-on: ubuntu-latest
        environment: production
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with: { node-version: 20 }

            - name: Authenticate
              # Written to a file and referenced by path. GOOGLE_APPLICATION_CREDENTIALS is a
              # PATH, not a payload — putting JSON in the variable itself is the mistake that
              # leaks a key into every child process's environment and into logs.
              run: |
                  printf '%s' '${{ secrets.GOOGLE_APPLICATION_CREDENTIALS }}' > "$RUNNER_TEMP/sa.json"
                  echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/sa.json" >> "$GITHUB_ENV"

            - name: Deploy indexes
              run: npx firebase-tools deploy --only firestore:indexes --project goalo-6a269 --non-interactive

            - name: Wait for every index to report READY
              # A deploy call returns as soon as the build is QUEUED. Serving an app against an
              # index that is still building is the same failure as not having it.
              run: |
                  for i in $(seq 1 60); do
                    if npx firebase-tools firestore:indexes --project goalo-6a269 2>/dev/null | grep -qi "CREATING\|BUILDING"; then
                      echo "indexes still building... ($i/60)"; sleep 30
                    else
                      echo "all indexes READY"; exit 0
                    fi
                  done
                  echo "Timed out waiting for indexes to finish building."; exit 1

    # ------------------------------------------------------------ 2. the app
    app:
        needs: indexes
        runs-on: ubuntu-latest
        environment: production
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with: { node-version: 20 }

            - name: Authenticate
              run: |
                  printf '%s' '${{ secrets.GOOGLE_APPLICATION_CREDENTIALS }}' > "$RUNNER_TEMP/sa.json"
                  echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/sa.json" >> "$GITHUB_ENV"

            - name: Roll out App Hosting
              # App Hosting also rolls out automatically on a push to main. This job exists so a
              # release is a deliberate act with a recorded approver rather than a side effect of
              # merging — a docs-only commit once shipped a rollout unasked (2026-08-09).
              run: npx firebase-tools apphosting:rollouts:create dosory --project goalo-6a269 --git-branch "${{ github.ref_name }}" --non-interactive

    # --------------------------------------------------------- 3. firestore rules
    rules:
        needs: app
        runs-on: ubuntu-latest
        environment: production
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with: { node-version: 20 }
            - uses: actions/setup-java@v4
              with: { distribution: temurin, java-version: 17 }

            - run: npm ci

            - name: Re-prove the rules against the emulator before deploying them
              # CLAUDE.md standing check 4. Rules are the one artifact whose failure mode is
              # silent and total, and the corpus already caught a rule that was completely inert
              # because the catch-all still granted what it tried to deny.
              run: npx firebase-tools emulators:exec --only firestore --project demo-ci "npx jest tests/firestore-rules/"

            - name: Authenticate
              run: |
                  printf '%s' '${{ secrets.GOOGLE_APPLICATION_CREDENTIALS }}' > "$RUNNER_TEMP/sa.json"
                  echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/sa.json" >> "$GITHUB_ENV"

            - name: Deploy rules
              run: npx firebase-tools deploy --only firestore:rules --project goalo-6a269 --non-interactive

    # ------------------------------------------------------------- 4. smoke
    smoke:
        needs: rules
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - name: Fetch the critical routes
              # Every route here is either load-bearing or a route we have PROVEN 404s today, so
              # a green smoke is evidence the fix shipped rather than an assumption that it did.
              # Authenticated routes are expected to redirect to /login, which is a 200 after the
              # redirect — a 404 or a 5xx is what fails the release.
              run: bash scripts/ci/smoke.sh "${{ vars.SMOKE_BASE_URL || 'https://dosory.com' }}"
